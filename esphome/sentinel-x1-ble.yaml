# Sentinel X1 BLE — ESP32-C6 Bluetooth bridge for the Kamoer X1 dosing pump (non-Pro, Bluetooth only)
# Build and flash from the ESPHome Device Builder in Home Assistant.
# 1. Set pump_mac to your pump's Bluetooth address (see README: "Find your pump's address").
# 2. Add wifi_ssid, wifi_password and sentinel_x1_ble_api_key to your ESPHome secrets.
substitutions:
  name: sentinel-x1-ble
  friendly_name: Sentinel X1 BLE
  pump_mac: "00:00:00:00:00:00"   # <-- your pump

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  variant: esp32c6
  framework:
    type: esp-idf

logger:

api:
  actions:
    - action: dose
      variables:
        ml: float
      then:
        - script.execute:
            id: dose_ml
            ml: !lambda 'return ml;'
    - action: run_seconds
      variables:
        seconds: float
      then:
        - script.execute:
            id: timed_run
            seconds: !lambda 'return seconds;'
    - action: stop
      then:
        - script.execute: stop_motor
    - action: calibrate
      variables:
        measured_ml: float
      then:
        - script.execute:
            id: write_calibration
            ms: !lambda 'return (int) roundf(10000.0f / measured_ml);'
    - action: refresh
      then:
        - script.execute: housekeeping
  encryption:
    key: !secret sentinel_x1_ble_api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Sentinel X1 BLE Fallback"

captive_portal:

# ---- Sentinel X1 BLE: Kamoer X1 Modbus-over-BLE bridge  ----
# Connect-on-demand: the link is opened for each command and closed when idle, like the
# Kamoer app. Doses run on the pump itself once started.
time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - script.execute: housekeeping

esp32_ble_tracker:
  scan_parameters:
    active: false
    interval: 320ms
    window: 30ms

ble_client:
  - mac_address: ${pump_mac}
    id: x1
    auto_connect: false
    on_disconnect:
      then:
        - lambda: id(link_ready) = false;

globals:
  - id: link_ready
    type: bool
    initial_value: 'false'
  - id: last_read_reg
    type: int
    initial_value: '0'
  - id: ms_per_ml
    type: int
    initial_value: '0'
  - id: run_ack
    type: int
    initial_value: '-1'
  - id: run_timer_ms
    type: uint32_t
    initial_value: '0'

script:
  # --- link management -------------------------------------------------------
  - id: link_up
    mode: single
    then:
      - if:
          condition:
            lambda: return !id(link_ready);
          then:
            - ble_client.connect: x1
            - delay: 800ms   # let notify registration settle
            - lambda: id(link_ready) = true;

  - id: link_idle
    mode: restart
    then:
      - delay: 5s
      - if:
          condition:
            lambda: return id(link_ready);
          then:
            - ble_client.disconnect: x1

  # Open the link (or fail after 20 s). Callers check id(link_ready) afterwards.
  - id: ensure_link
    mode: queued
    then:
      - script.stop: link_idle
      - script.execute: link_up
      - wait_until:
          condition:
            lambda: return id(link_ready);
          timeout: 20s
      - if:
          condition:
            lambda: return !id(link_ready);
          then:
            # connect attempt never completed: cancel it so the next try starts clean
            - script.stop: link_up
            - ble_client.disconnect: x1
      - lambda: |-
          id(pump_reachable).publish_state(id(link_ready));
          if (id(link_ready)) {
            auto t = id(ha_time).now();
            if (t.is_valid()) id(last_contact).publish_state(t.strftime("%Y-%m-%dT%H:%M:%S%z"));
          } else {
            id(last_result).publish_state("Pump not reachable");
          }

  # --- one Modbus frame (CRC added here), spaced 300 ms ------------------------
  - id: send_frame
    mode: queued
    max_runs: 20
    parameters:
      frame: int[]
    then:
      - ble_client.ble_write:
          id: x1
          service_uuid: "FFE0"
          characteristic_uuid: "FFE1"
          value: !lambda |-
            std::vector<uint8_t> v;
            for (int b : frame) v.push_back((uint8_t) b);
            uint16_t crc = 0xFFFF;
            for (uint8_t b : v) {
              crc ^= b;
              for (int i = 0; i < 8; i++) crc = (crc & 1) ? (crc >> 1) ^ 0xA001 : (crc >> 1);
            }
            v.push_back(crc & 0xFF);
            v.push_back(crc >> 8);
            if (v.size() >= 4 && v[1] == 0x03) id(last_read_reg) = (v[2] << 8) | v[3];
            return v;
      - delay: 300ms

  # Start the motor and confirm with a coil read. Sets run_ack: 1 ok, 0 no.
  - id: start_and_confirm
    then:
      - lambda: id(run_ack) = -1;
      - script.execute:
          id: send_frame
          frame: [0x01, 0x05, 0x10, 0x02, 0xFF, 0x00]
      - script.wait: send_frame
      - delay: 300ms
      - script.execute:
          id: send_frame
          frame: [0x01, 0x01, 0x10, 0x02, 0x00, 0x01]
      - script.wait: send_frame
      - wait_until:
          condition:
            lambda: return id(run_ack) >= 0;
          timeout: 2s

  # --- actions ----------------------------------------------------------------
  - id: dose_ml
    mode: queued
    parameters:
      ml: float
    then:
      - if:
          condition:
            lambda: return ml >= 0.1 && ml <= 6000.0;
          then:
            - script.execute: ensure_link
            - script.wait: ensure_link
            - if:
                condition:
                  lambda: return id(link_ready);
                then:
                  - script.execute:
                      id: send_frame
                      frame: !lambda |-
                        int t = (int) roundf(ml * 10.0f);
                        return std::vector<int>{0x01, 0x10, 0x30, 0x32, 0x00, 0x02, 0x04,
                                                0x00, 0x00, (t >> 8) & 0xFF, t & 0xFF};
                  - script.wait: send_frame
                  - script.execute: start_and_confirm
                  - script.wait: start_and_confirm
                  - lambda: |-
                      bool ok = id(run_ack) == 1;
                      char buf[64];
                      snprintf(buf, sizeof(buf), ok ? "Dosing %.1f mL" : "Dose %.1f mL not confirmed", ml);
                      id(last_result).publish_state(buf);
                      if (ok) {
                        id(pump_running).publish_state(true);
                        uint32_t ms = id(ms_per_ml) > 0 ? (uint32_t) (ml * id(ms_per_ml)) : (uint32_t) (ml * 1500.0f);
                        id(run_timer_ms) = ms + 1500;
                      }
                  - homeassistant.event:
                      event: esphome.sentinel_x1_ble_dose
                      data:
                        ml: !lambda return ml;
                        ok: !lambda 'return id(run_ack) == 1 ? "true" : "false";'
                  - if:
                      condition:
                        lambda: return id(run_ack) == 1;
                      then:
                        - script.execute: run_timer
            - script.execute: link_idle

  - id: timed_run
    mode: queued
    parameters:
      seconds: float
    then:
      - if:
          condition:
            lambda: return seconds >= 0.5 && seconds <= 65.0;
          then:
            - script.execute: ensure_link
            - script.wait: ensure_link
            - if:
                condition:
                  lambda: return id(link_ready);
                then:
                  - script.execute:
                      id: send_frame
                      frame: !lambda |-
                        int ms = (int) roundf(seconds * 1000.0f);
                        return std::vector<int>{0x01, 0x06, 0x30, 0x32, (ms >> 8) & 0xFF, ms & 0xFF};
                  - script.wait: send_frame
                  - script.execute: start_and_confirm
                  - script.wait: start_and_confirm
                  - lambda: |-
                      bool ok = id(run_ack) == 1;
                      char buf[64];
                      snprintf(buf, sizeof(buf), ok ? "Running %.1f s" : "Run %.1f s not confirmed", seconds);
                      id(last_result).publish_state(buf);
                      if (ok) { id(pump_running).publish_state(true); id(run_timer_ms) = (uint32_t) (seconds * 1000) + 1500; }
                  - homeassistant.event:
                      event: esphome.sentinel_x1_ble_run
                      data:
                        seconds: !lambda return seconds;
                        ok: !lambda 'return id(run_ack) == 1 ? "true" : "false";'
                  - if:
                      condition:
                        lambda: return id(run_ack) == 1;
                      then:
                        - script.execute: run_timer
                  # put the run-mode register back to "volume dose", as the Kamoer app does
                  - delay: !lambda return (uint32_t) (seconds * 1000) + 500;
                  - script.execute: ensure_link
                  - script.wait: ensure_link
                  - if:
                      condition:
                        lambda: return id(link_ready);
                      then:
                        - script.execute:
                            id: send_frame
                            frame: [0x01, 0x06, 0x30, 0x32, 0x00, 0x00]
                        - script.wait: send_frame
            - script.execute: link_idle

  - id: stop_motor
    then:
      - script.execute: ensure_link
      - script.wait: ensure_link
      - if:
          condition:
            lambda: return id(link_ready);
          then:
            - script.execute:
                id: send_frame
                frame: [0x01, 0x05, 0x10, 0x02, 0x00, 0x00]
            - script.wait: send_frame
            - script.execute:
                id: send_frame
                frame: [0x01, 0x06, 0x30, 0x32, 0x00, 0x00]
            - script.wait: send_frame
            - script.stop: run_timer
            - lambda: |-
                id(pump_running).publish_state(false);
                id(last_result).publish_state("Stopped");
      - script.execute: link_idle

  - id: run_timer
    mode: restart
    then:
      - delay: !lambda return id(run_timer_ms);
      - lambda: id(pump_running).publish_state(false);

  - id: housekeeping
    mode: single
    then:
      - script.execute: ensure_link
      - script.wait: ensure_link
      - if:
          condition:
            lambda: return id(link_ready);
          then:
            - if:
                condition:
                  lambda: return id(ha_time).now().is_valid();
                then:
                  - script.execute:
                      id: send_frame
                      frame: !lambda |-
                        auto t = id(ha_time).now();
                        return std::vector<int>{0x01, 0x10, 0x30, 0x0F, 0x00, 0x03, 0x06,
                                                t.year % 100, t.month, t.day_of_month,
                                                t.hour, t.minute, t.second};
                  - script.wait: send_frame
                  - script.execute:
                      id: send_frame
                      frame: [0x01, 0x05, 0x10, 0x03, 0xFF, 0x00]
                  - script.wait: send_frame
            - script.execute:
                id: send_frame
                frame: [0x01, 0x03, 0x30, 0x09, 0x00, 0x03]
            - script.wait: send_frame
            - delay: 500ms
      - script.execute: link_idle

  - id: write_calibration
    parameters:
      ms: int
    then:
      - script.execute: ensure_link
      - script.wait: ensure_link
      - if:
          condition:
            lambda: return id(link_ready) && ms >= 200 && ms <= 30000;
          then:
            - script.execute:
                id: send_frame
                frame: !lambda return std::vector<int>{0x01, 0x06, 0x30, 0x09, (ms >> 8) & 0xFF, ms & 0xFF};
            - script.wait: send_frame
            - script.execute:
                id: send_frame
                frame: [0x01, 0x05, 0x10, 0x03, 0xFF, 0x00]
            - script.wait: send_frame
            - script.execute:
                id: send_frame
                frame: [0x01, 0x03, 0x30, 0x09, 0x00, 0x03]
            - script.wait: send_frame
            - delay: 500ms
            - lambda: id(last_result).publish_state("Calibration saved");
            - homeassistant.event:
                event: esphome.sentinel_x1_ble_calibrated
                data:
                  ml_per_min: !lambda 'return id(ms_per_ml) > 0 ? 60000.0f / id(ms_per_ml) : 0.0f;'
      - script.execute: link_idle

  - id: roll_call
    then:
      - script.execute: ensure_link
      - script.wait: ensure_link
      - if:
          condition:
            lambda: return id(link_ready);
          then:
            - script.execute:
                id: send_frame
                frame: [0x01, 0x05, 0x10, 0x01, 0xFF, 0x00]
            - script.wait: send_frame
      - script.execute: link_idle

interval:
  - interval: 6h
    then:
      - script.execute: housekeeping

# ---------------------------------------------------------------------------
# Replies from the pump (notifications on FFE1)
# ---------------------------------------------------------------------------
sensor:
  - platform: ble_client
    type: characteristic
    ble_client_id: x1
    id: rx_frame
    internal: true
    service_uuid: "FFE0"
    characteristic_uuid: "FFE1"
    notify: true
    update_interval: never
    lambda: |-
      ESP_LOGD("x1", "rx %s (last read reg %04X)", format_hex_pretty(x).c_str(), id(last_read_reg));
      if (x.size() < 5 || x[0] != 0x01) return NAN;
      uint8_t fn = x[1];
      if (fn == 0x01) {
        id(run_ack) = (x[3] & 0x01) ? 1 : 0;
      } else if (fn == 0x03 && x.size() >= 5) {
        uint16_t v = (x[3] << 8) | x[4];
        if (id(last_read_reg) == 0x3009 && v > 0) {
          id(ms_per_ml) = v;
          id(pump_flow).publish_state(60000.0f / v);
        }
      }
      return (float) fn;

  - platform: template
    id: pump_flow
    name: "Flow rate (calibrated)"
    unit_of_measurement: "mL/min"
    accuracy_decimals: 1
    icon: mdi:water-pump

binary_sensor:
  - platform: template
    id: pump_reachable
    name: "Pump reachable"
    device_class: connectivity
  - platform: template
    id: pump_running
    name: "Pump dosing"
    device_class: running

text_sensor:
  - platform: template
    id: last_result
    name: "Last result"
    icon: mdi:message-text-outline
  - platform: template
    id: last_contact
    name: "Last contact"
    device_class: timestamp

button:
  - platform: template
    name: "Stop"
    icon: mdi:stop-circle
    on_press:
      - script.execute: stop_motor
  - platform: template
    name: "Roll call"
    icon: mdi:bell-ring
    on_press:
      - script.execute: roll_call
  - platform: template
    name: "Refresh"
    icon: mdi:refresh
    entity_category: diagnostic
    on_press:
      - script.execute: housekeeping
